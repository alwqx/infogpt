name: InfoGPT CI
on: push
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.18
        uses: actions/setup-go@v6
        with:
          go-version: 1.18
        id: go

      - name: Check out source code
        uses: actions/checkout@v6

      - name: Test
        run: go test -v ./...
